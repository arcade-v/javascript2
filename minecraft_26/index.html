<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap"
    rel="stylesheet"
  >
  <base href="https://cdn.jsdelivr.net/gh/arcade-v/javascript2@661c745/minecraft_26/">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Pixelify Sans', cursive;
      font-size: 48px;
      text-align: center;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="loading-text">LOADING...</div>

  <script>
    const BASE_URL =
      'https://cdn.jsdelivr.net/gh/arcade-v/javascript2/minecraft_26/';

    const PART_COUNT = 4;

    let gameBlobURL = null;

    async function loadHTMLParts() {
      const loadingText = document.getElementById('loading-text');

      try {
        let combinedHTML = '';

        for (let i = 1; i <= PART_COUNT; i++) {
          const part = `eaglercraft_26.2.html.part${i}`;
          const url = BASE_URL + part;

          loadingText.textContent =
            `LOADING PART ${i}/${PART_COUNT}...`;

          console.log('Fetching:', url);

          const response = await fetch(url, {
            cache: 'no-store'
          });

          if (!response.ok) {
            throw new Error(
              `Failed to load ${part}: HTTP ${response.status}`
            );
          }

          combinedHTML += await response.text();
        }

        loadingText.textContent = 'PREPARING GAME...';

        combinedHTML = combinedHTML.replace(
          /<base\b[^>]*>/gi,
          ''
        );

        const baseTag = `<base href="${BASE_URL}">`;

        if (/<head\b[^>]*>/i.test(combinedHTML)) {
          combinedHTML = combinedHTML.replace(
            /<head\b[^>]*>/i,
            match => match + '\n' + baseTag
          );
        } else {
          combinedHTML =
            '<!DOCTYPE html><html><head>' +
            baseTag +
            '</head><body>' +
            combinedHTML +
            '</body></html>';
        }

        const gameBlob = new Blob(
          [combinedHTML],
          { type: 'text/html;charset=utf-8' }
        );

        gameBlobURL = URL.createObjectURL(gameBlob);

        const iframe = document.createElement('iframe');

        iframe.id = 'game';
        iframe.title = 'OMORI';
        iframe.src = gameBlobURL;
        iframe.allow = 'autoplay; fullscreen; gamepad';
        iframe.allowFullscreen = true;

        iframe.onload = () => {
          console.log('Game document loaded.');
        };

        iframe.onerror = () => {
          console.error('The game iframe failed to load.');
        };

        document.body.replaceChildren(iframe);

        const observer = new MutationObserver(() => {
          if (!iframe.isConnected) {
            cleanup();
            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          childList: true
        });

      } catch (error) {
        console.error('Error loading game:', error);

        loadingText.textContent =
          'FAILED TO LOAD GAME: ' + error.message;

        loadingText.style.fontSize = '22px';
      }
    }

    function cleanup() {
      if (gameBlobURL) {
        URL.revokeObjectURL(gameBlobURL);
        gameBlobURL = null;
      }
    }

    loadHTMLParts();
  </script>
</body>
</html>
